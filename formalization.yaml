version: "1.0"

project:
  name: "nabla-field-annihilation"
  description: "Formal proof of higher-dimensional Nabla field annihilation over Boolean hypercube in Lean 4."
  authors:
    - "Dominic Shum"
  license: "MIT"
  responsible_maintainers:
    - "Dominic Shum"

classification:
  arxiv:
    - "math.CO"

sources:
  - type: "original-proof"
    description: "Original proof by Dominic Shum using mutual induction and parity cancellation."

automation:
  methods:
    - "interactive"
    - "LLM-assisted"

review:
  status: "author-reviewed"

technical_details:
  lean_version: "leanprover/lean4:v4.28.0" # 請填寫你 lakefile.lean 實際使用的 Lean 版本
  dependencies:
    - name: "Mathlib"
      version: "main"

files:
  challenge: "Challenge.lean"  # 你的定理陳述檔案路徑
  solution: "Solution.lean"   # 你的證明檔案路徑

disclosures:
  ai_usage:
    category: "hybrid" # 選項可為: human | ai | hybrid
    statement: >
      The core theoretical framework and mathematical proof design were conceptualized 
      by Dominic Shum. AI language models were used as interactive assistants to suggest Lean tactics 
      and assist with syntax boilerplate.
  axioms_used:
    standard_only: true
    custom_axioms: []
